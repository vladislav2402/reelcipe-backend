name: reelcipe-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: reelcipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reelcipe}
      POSTGRES_USER: ${POSTGRES_USER:-reelcipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelcipe-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reelcipe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  reelcipe-postgres-data:
