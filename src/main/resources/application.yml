spring:
  application:
    name: reelcipe-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reelcipe}
    username: ${DATABASE_USER:reelcipe}
    password: ${DATABASE_PASSWORD:reelcipe_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

app:
  role: ${APP_ROLE:api}
  instance-id: ${APP_INSTANCE_ID:}
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
    execution-slots: ${APP_WORKER_EXECUTION_SLOTS:2}
    lease-duration: ${APP_WORKER_LEASE_DURATION:PT90S}
    clock-skew-tolerance: ${APP_WORKER_CLOCK_SKEW_TOLERANCE:PT1S}
    poll-interval-ms: ${APP_WORKER_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${APP_WORKER_HEARTBEAT_INTERVAL_MS:20000}
    max-stage-attempts: ${APP_WORKER_MAX_STAGE_ATTEMPTS:3}
    retry-initial-delay: ${APP_WORKER_RETRY_INITIAL_DELAY:PT2S}
    retry-maximum-delay: ${APP_WORKER_RETRY_MAXIMUM_DELAY:PT15M}
    retry-jitter-ratio: ${APP_WORKER_RETRY_JITTER_RATIO:0.2}
    input-wait-duration: ${APP_WORKER_INPUT_WAIT_DURATION:PT24H}
    max-input-continuations: ${APP_WORKER_MAX_INPUT_CONTINUATIONS:3}
    expiry-interval-ms: ${APP_WORKER_EXPIRY_INTERVAL_MS:60000}
    expiry-batch-size: ${APP_WORKER_EXPIRY_BATCH_SIZE:20}
    operations-interval-ms: ${APP_WORKER_OPERATIONS_INTERVAL_MS:60000}
    operations-batch-size: ${APP_WORKER_OPERATIONS_BATCH_SIZE:20}
    operations-lease-duration: ${APP_WORKER_OPERATIONS_LEASE_DURATION:PT90S}
    operations-max-attempts: ${APP_WORKER_OPERATIONS_MAX_ATTEMPTS:8}
    operations-retry-initial-delay: ${APP_WORKER_OPERATIONS_RETRY_INITIAL_DELAY:PT2S}
    operations-retry-maximum-delay: ${APP_WORKER_OPERATIONS_RETRY_MAXIMUM_DELAY:PT15M}
    operations-retry-jitter-ratio: ${APP_WORKER_OPERATIONS_RETRY_JITTER_RATIO:0.2}
    processing-copy-temp-directory: ${APP_WORKER_PROCESSING_COPY_TEMP_DIRECTORY:${java.io.tmpdir}/reelcipe-processing}
    processing-copy-max-bytes: ${APP_WORKER_PROCESSING_COPY_MAX_BYTES:104857600}
    media-concurrency: ${APP_WORKER_MEDIA_CONCURRENCY:1}
    upload-reconciler-interval-ms: ${APP_WORKER_UPLOAD_RECONCILER_INTERVAL_MS:30000}
    upload-reconciler-batch-size: ${APP_WORKER_UPLOAD_RECONCILER_BATCH_SIZE:20}
  providers:
    mode: ${APP_PROVIDERS_MODE:mock}
    admission:
      daily-budget-units: ${APP_PROVIDERS_DAILY_BUDGET_UNITS:100000}
      max-concurrent-attempts: ${APP_PROVIDERS_MAX_CONCURRENT_ATTEMPTS:2}
      reservation-ttl: ${APP_PROVIDERS_RESERVATION_TTL:PT5M}
      failure-window: ${APP_PROVIDERS_FAILURE_WINDOW:PT1H}
      max-failures-per-user: ${APP_PROVIDERS_MAX_FAILURES_PER_USER:3}
      user-backoff: ${APP_PROVIDERS_USER_BACKOFF:PT15M}
      recovery-interval-ms: ${APP_PROVIDERS_ADMISSION_RECOVERY_INTERVAL_MS:30000}
    real-calls-enabled: ${APP_PROVIDERS_REAL_CALLS_ENABLED:false}
    redaction-enabled: ${APP_PROVIDERS_REDACTION_ENABLED:true}
    http:
      connect-timeout: ${APP_PROVIDERS_HTTP_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${APP_PROVIDERS_HTTP_READ_TIMEOUT:PT60S}
      max-request-bytes: ${APP_PROVIDERS_HTTP_MAX_REQUEST_BYTES:26214400}
      max-response-bytes: ${APP_PROVIDERS_HTTP_MAX_RESPONSE_BYTES:1048576}
      api-rate-limit-per-minute: ${APP_PROVIDERS_API_RATE_LIMIT_PER_MINUTE:60}
    circuit-breaker:
      failure-threshold: ${APP_PROVIDERS_CIRCUIT_FAILURE_THRESHOLD:5}
      open-duration: ${APP_PROVIDERS_CIRCUIT_OPEN_DURATION:PT30S}
    adapters:
      asr:
        base-url: ${APP_ASR_BASE_URL:https://api.groq.com/openai/v1}
        api-key-secret-name: ${APP_ASR_API_KEY_SECRET_NAME:ASR_API_KEY}
      llm:
        base-url: ${APP_LLM_BASE_URL:https://api.groq.com/openai/v1}
        api-key-secret-name: ${APP_LLM_API_KEY_SECRET_NAME:LLM_API_KEY}
  limits:
    max-media-duration-seconds: ${APP_MAX_MEDIA_DURATION_SECONDS:180}
    max-video-size-bytes: ${APP_MAX_VIDEO_SIZE_BYTES:104857600}
    max-audio-size-bytes: ${APP_MAX_AUDIO_SIZE_BYTES:20971520}
    max-description-characters: ${APP_MAX_DESCRIPTION_CHARACTERS:20000}
    max-active-imports-per-user: ${APP_MAX_ACTIVE_IMPORTS_PER_USER:2}
  import:
    upload-ttl: ${APP_IMPORT_UPLOAD_TTL:PT24H}
    upload-url-ttl: ${APP_IMPORT_UPLOAD_URL_TTL:PT1H}
    max-upload-attempts: ${APP_IMPORT_MAX_UPLOAD_ATTEMPTS:3}
    processing-ttl: ${APP_IMPORT_PROCESSING_TTL:PT48H}
    local-fixtures-directory: ${APP_IMPORT_LOCAL_FIXTURES_DIRECTORY:${user.dir}/.local/fixtures}
    source:
      read-timeout: ${APP_IMPORT_SOURCE_READ_TIMEOUT:PT60S}
      max-bytes: ${APP_IMPORT_SOURCE_MAX_BYTES:104857600}
      max-redirects: ${APP_IMPORT_SOURCE_MAX_REDIRECTS:3}
      temp-directory: ${APP_IMPORT_SOURCE_TEMP_DIRECTORY:${java.io.tmpdir}/reelcipe-source}
      allow-local-addresses: ${APP_IMPORT_SOURCE_ALLOW_LOCAL_ADDRESSES:false}
      allow-non-standard-ports: ${APP_IMPORT_SOURCE_ALLOW_NON_STANDARD_PORTS:false}
    tiktok:
      provider: ${APP_TIKTOK_RESOLVER_PROVIDER:rapidapi}
      rapidapi-base-url: ${APP_RAPIDAPI_TIKTOK_BASE_URL:https://tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com}
      apify-api-base-url: ${APP_APIFY_API_BASE_URL:https://api.apify.com/v2}
      timeout: ${APP_TIKTOK_RESOLVER_TIMEOUT:PT120S}
      max-response-bytes: ${APP_TIKTOK_RESOLVER_MAX_RESPONSE_BYTES:10485760}
  storage:
    provider: ${APP_STORAGE_PROVIDER:s3}
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9090}
    region: ${APP_STORAGE_REGION:us-east-1}
    access-key: ${APP_STORAGE_ACCESS_KEY:accessKey1}
    secret-key: ${APP_STORAGE_SECRET_KEY:secretKey1}
    bucket: ${APP_STORAGE_BUCKET:reelcipe-local}
    path-style: ${APP_STORAGE_PATH_STYLE:true}
  media-tools:
    provider: ${APP_MEDIA_TOOLS_PROVIDER:compose}
    compose-command: ${APP_MEDIA_TOOLS_COMPOSE_COMMAND:docker}
    compose-env-file: ${APP_MEDIA_TOOLS_COMPOSE_ENV_FILE:infra/.env.local}
    compose-file: ${APP_MEDIA_TOOLS_COMPOSE_FILE:infra/compose.local.yml}
    compose-service: ${APP_MEDIA_TOOLS_COMPOSE_SERVICE:media-tools}
    ffprobe-command: ${APP_MEDIA_TOOLS_FFPROBE_COMMAND:ffprobe}
    ffmpeg-command: ${APP_MEDIA_TOOLS_FFMPEG_COMMAND:ffmpeg}
    work-directory: ${APP_MEDIA_TOOLS_WORK_DIRECTORY:${user.dir}/.local/media-work}
    timeout: ${APP_MEDIA_TOOLS_TIMEOUT:PT2M}
    max-output-bytes: ${APP_MEDIA_TOOLS_MAX_OUTPUT_BYTES:65536}
  asr:
    provider: ${APP_ASR_PROVIDER:mock}
    language: ${APP_ASR_LANGUAGE:uk}
    mock-model: ${APP_ASR_MOCK_MODEL:reelcipe-mock-asr-v1}
    groq-model: ${APP_ASR_GROQ_MODEL:whisper-large-v3-turbo}
  llm:
    provider: ${APP_LLM_PROVIDER:mock}
    mock-model: ${APP_LLM_MOCK_MODEL:reelcipe-mock-llm-v1}
    groq-model: ${APP_LLM_GROQ_MODEL:openai/gpt-oss-120b}
    max-output-tokens: ${APP_LLM_MAX_OUTPUT_TOKENS:4096}
    prompt-version: ${APP_LLM_PROMPT_VERSION:recipe-extraction-v1}
    schema-version: ${APP_LLM_SCHEMA_VERSION:recipe-extraction-v1}
    pipeline-version: ${APP_LLM_PIPELINE_VERSION:b21-v1}
    target-language: ${APP_LLM_TARGET_LANGUAGE:uk}
    corrective-retry-limit: ${APP_LLM_CORRECTIVE_RETRY_LIMIT:1}
  features:
    share-extension: ${APP_FEATURE_SHARE_EXTENSION:false}
    apple-sign-in: ${APP_FEATURE_APPLE_SIGN_IN:false}
    subscriptions: ${APP_FEATURE_SUBSCRIPTIONS:false}
    enabled-link-platforms: ${APP_ENABLED_LINK_PLATFORMS:}
  auth:
    jwt-secret: ${APP_JWT_SECRET:reelcipe-local-jwt-secret-change-before-production-32bytes}
    issuer: ${APP_JWT_ISSUER:reelcipe-local}
    access-token-ttl-seconds: ${APP_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${APP_REFRESH_TOKEN_TTL_SECONDS:2592000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: worker

server:
  port: ${SERVER_PORT:8081}

app:
  role: ${APP_ROLE:worker}
