spring:
  application:
    name: reelcipe-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reelcipe}
    username: ${DATABASE_USER:reelcipe}
    password: ${DATABASE_PASSWORD:reelcipe_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

app:
  role: ${APP_ROLE:api}
  instance-id: ${APP_INSTANCE_ID:${random.uuid}}
  providers:
    mode: ${APP_PROVIDERS_MODE:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: worker
  liquibase:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

app:
  role: ${APP_ROLE:worker}
