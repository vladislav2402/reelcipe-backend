spring:
  application:
    name: reelcipe-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reelcipe}
    username: ${DATABASE_USER:reelcipe}
    password: ${DATABASE_PASSWORD:reelcipe_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

app:
  role: ${APP_ROLE:api}
  instance-id: ${APP_INSTANCE_ID:${random.uuid}}
  providers:
    mode: ${APP_PROVIDERS_MODE:mock}
  limits:
    max-media-duration-seconds: ${APP_MAX_MEDIA_DURATION_SECONDS:180}
    max-video-size-bytes: ${APP_MAX_VIDEO_SIZE_BYTES:104857600}
    max-audio-size-bytes: ${APP_MAX_AUDIO_SIZE_BYTES:20971520}
    max-description-characters: ${APP_MAX_DESCRIPTION_CHARACTERS:20000}
    max-active-imports-per-user: ${APP_MAX_ACTIVE_IMPORTS_PER_USER:2}
  import:
    upload-ttl: ${APP_IMPORT_UPLOAD_TTL:PT24H}
    processing-ttl: ${APP_IMPORT_PROCESSING_TTL:PT48H}
  features:
    share-extension: ${APP_FEATURE_SHARE_EXTENSION:false}
    apple-sign-in: ${APP_FEATURE_APPLE_SIGN_IN:false}
    subscriptions: ${APP_FEATURE_SUBSCRIPTIONS:false}
    enabled-link-platforms: ${APP_ENABLED_LINK_PLATFORMS:}
  auth:
    jwt-secret: ${APP_JWT_SECRET:reelcipe-local-jwt-secret-change-before-production-32bytes}
    issuer: ${APP_JWT_ISSUER:reelcipe-local}
    access-token-ttl-seconds: ${APP_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${APP_REFRESH_TOKEN_TTL_SECONDS:2592000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: worker
  liquibase:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

app:
  role: ${APP_ROLE:worker}
